[package]
name = "bearbasket-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace deps
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true

# Async runtime
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros"] }

# LAN discovery (mDNS)
mdns-sd = "0.17"

# Networking
bytes = "1.5"
quinn = "0.11"  # QUIC transport
rustls = "0.23" # TLS for QUIC

[features]
default = []
