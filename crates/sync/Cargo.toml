[package]
name = "bearbasket-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Workspace deps
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true

# Async runtime
tokio = { version = "1.48", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "io-util",
    "macros",
    "time",
] }
tokio-util = { version = "0.7", features = ["codec"] }

# LAN discovery (mDNS)
mdns-sd = "0.17"

# Networking  
bytes = "1.5"

# System info
hostname = "0.4"

# Encoding
base64 = "0.22"

[features]
default = []
