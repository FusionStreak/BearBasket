[workspace]
members = ["src-tauri", "crates/core", "crates/sync"]

resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Sayfullah Eid <mail@sayfullaheid.me>"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.6", features = ["v4"] }
tracing = "0.1"
